name: eada
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pytorch=2.2.2
  - torchvision=0.17.2
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pip:
      - Pillow==11.0.0
      - PyYAML==6.0.2
      - fvcore==0.1.5.post20221221
      - iopath==0.1.10
      - pycocotools==2.0.10
      - tabulate==0.9.0
      - ftfy==6.1.3
      - regex==2023.12.25
      - tqdm==4.66.1
      - open_clip_torch==2.24.0

# Detectron2 0.3 and MMCV 1.7.2 must be compiled against the selected
# PyTorch/CUDA toolchain. MMDetection 2.28.2 is installed after MMCV so pip
# cannot pull an incompatible MMCV build. See INSTALL.md.
