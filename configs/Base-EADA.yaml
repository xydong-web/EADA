VERSION: 2
MODEL:
  META_ARCHITECTURE: EADA
  WEIGHTS: ""
  MASK_ON: false
  BACKBONE:
    NAME: build_resnet_backbone
    FREEZE_AT: 3
  RESNETS:
    DEPTH: 101
    OUT_FEATURES: [res4]
    RES2_OUT_CHANNELS: 256
    STRIDE_IN_1X1: true
    NORM: FrozenBN
  PROPOSAL_GENERATOR:
    NAME: RPN
  RPN:
    IN_FEATURES: [res4]
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TEST: 1000
  ROI_HEADS:
    NAME: EADAROIHeads
    IN_FEATURES: [res4]
    BATCH_SIZE_PER_IMAGE: 512
    SCORE_THRESH_TEST: 0.05
    NMS_THRESH_TEST: 0.5
  ROI_BOX_HEAD:
    POOLER_RESOLUTION: 7
    POOLER_TYPE: ROIAlignV2
    CLS_AGNOSTIC_BBOX_REG: false
  ROI_MASK_HEAD:
    NAME: MaskRCNNConvUpsampleHead
    CLS_AGNOSTIC_MASK: true
    POOLER_RESOLUTION: 14
    POOLER_SAMPLING_RATIO: 0
    POOLER_TYPE: ROIAlignV2
    NUM_CONV: 4
    CONV_DIM: 256
  EADA:
    SAIA_ENABLED: true
    SAIA_ALPHA: 0.2
    DC_ENABLED: true
    ROI_PREDICTOR_MODE: standard
    RPN_GRADIENT_SCALE: 0.0
    ROI_GRADIENT_SCALE: 0.001
    CLS_DROPOUT: 0.8
    FREEZE_ROI_FEATURE: true
    FSIS_MASK_ONLY: false
    FSIS_FEATURE_SOURCE: pre_saia
INPUT:
  FORMAT: BGR
  MASK_FORMAT: polygon
  MIN_SIZE_TRAIN: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
  MIN_SIZE_TEST: 800
DATALOADER:
  NUM_WORKERS: 4
DATASETS:
  EADA_TWO_STREAM: false
  BASE_TRAIN: []
SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0025
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.00005
  WARMUP_ITERS: 0
  CHECKPOINT_PERIOD: 100000
TEST:
  SPDI_ENABLED: true
  SPDI_CHECKPOINT: ""
  SPDI_MODEL_NAME: ViT-B-16
  SPDI_PRETRAINED: openai
  SPDI_TOPK: 100
  SPDI_TEMPERATURE: 0.01
  SPDI_LAMBDA_NOVEL: 0.7
  SPDI_FUSION_MODE: absolute
  SPDI_PLACEMENT: pre_nms
  SPDI_BATCH_SIZE: 64
  SPDI_TEXT_TEMPLATES: ["a photo of a {}", "a clean photo of a {}"]
  EVAL_PERIOD: 0
  DETECTIONS_PER_IMAGE: 100
SEED: 0
