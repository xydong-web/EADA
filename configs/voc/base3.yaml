_BASE_: ../Base-EADA.yaml
MODEL:
  ROI_HEADS:
    NUM_CLASSES: 15
  EADA:
    SAIA_ENABLED: false
    DC_ENABLED: false
    ROI_PREDICTOR_MODE: residual_trainable
    ROI_GRADIENT_SCALE: 0.75
    CLS_DROPOUT: 0.0
    FREEZE_ROI_FEATURE: false
DATASETS:
  TRAIN: [voc_2007_trainval_base3, voc_2012_trainval_base3]
  TEST: [voc_2007_test_base3]
SOLVER:
  IMS_PER_BATCH: 32
  BASE_LR: 0.01
  STEPS: [10000, 13300]
  MAX_ITER: 15000
  WARMUP_ITERS: 100
TEST:
  SPDI_ENABLED: false
OUTPUT_DIR: outputs/voc_base3
